<!doctype html>
<meta charset="utf-8">
<title>React fixture</title>
<div id="root"></div>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script>
  // createElement + __source mimics what the JSX dev transform produces in a real app.
  const h = React.createElement;
  const src = (fileName, lineNumber) => ({ fileName, lineNumber, columnNumber: 1 });
  function PricingCard() {
    return h('div', { className: 'card', __source: src('/src/components/PricingCard.tsx', 40) },
      h('button', { id: 'rbtn', className: 'btn', __source: src('/src/components/PricingCard.tsx', 42) }, 'Start free trial'));
  }
  function App() {
    return h('main', { __source: src('/src/App.tsx', 8) }, h(PricingCard, { __source: src('/src/App.tsx', 9) }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
