<!doctype html>
<meta charset="utf-8">
<title>Vanilla fixture</title>
<style>body{font:16px system-ui;margin:24px} .plans{display:flex;gap:16px} .card{border:1px solid #ccc;padding:12px;width:200px} .btn-primary{background:rgb(37,99,235);color:#fff;border:0;padding:10px 16px;font-weight:600}</style>
<main>
  <h1 id="title">Pricing</h1>
  <section class="plans">
    <div class="card" id="card-a"><h2>Free</h2><button class="btn btn-primary" id="cta" data-testid="cta">Start free trial</button></div>
    <div class="card" id="card-b"><h2>Pro</h2><button class="btn btn-primary">Buy</button></div>
    <div class="card" id="card-c"><h2>Team</h2><svg width="20" height="20"><circle cx="10" cy="10" r="8"/></svg><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></div>
  </section>
  <form id="login" style="margin-top:24px">
    <input id="user" name="user" value="alice@example.com">
    <input id="pw" type="password" name="pw" value="hunter2-secret">
    <textarea id="bio">my private bio</textarea>
  </form>
  <p id="astro" data-astro-source-file="/src/pages/index.astro" data-astro-source-loc="12:5">From an Astro-style build</p>
</main>
<script>
  window.__clicks = 0;
  document.addEventListener('click', () => { window.__clicks++; });
  document.getElementById('cta').addEventListener('click', () => { window.__clicks += 100; });
</script>
